<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" width="280" height="320">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8252e"/>
      <stop offset="50%" stop-color="#c41e29"/>
      <stop offset="100%" stop-color="#a8161f"/>
    </linearGradient>

    <radialGradient id="centerGrad" cx="32%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff5c0"/>
      <stop offset="35%" stop-color="#f7d04a"/>
      <stop offset="75%" stop-color="#d49622"/>
      <stop offset="100%" stop-color="#9c6817"/>
    </radialGradient>

    <radialGradient id="coinGrad" cx="32%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#fff0a8"/>
      <stop offset="30%" stop-color="#f5c93a"/>
      <stop offset="65%" stop-color="#d99820"/>
      <stop offset="100%" stop-color="#a3681a"/>
    </radialGradient>

    <radialGradient id="coinRimGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#c08820"/>
      <stop offset="100%" stop-color="#7a4d10"/>
    </radialGradient>

    <symbol id="cornerOrn" viewBox="0 0 22 22">
      <g fill="none" stroke="#e8b647" stroke-width="1.5" stroke-linecap="square">
        <path d="M0 21 L0 0 L21 0"/>
        <path d="M4 21 L4 4 L21 4"/>
      </g>
      <rect x="6.5" y="6.5" width="4" height="4" fill="#e8b647"/>
