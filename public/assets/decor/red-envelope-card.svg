      <circle r="8.5" fill="none" stroke="#7a4d10" stroke-width="0.5" opacity="0.55"/>
      <rect x="-3" y="-3" width="6" height="6" fill="#2a1c08"/>
      <ellipse cx="-4.5" cy="-6" rx="4" ry="1.8" fill="#fff5d6" opacity="0.55" transform="rotate(-35)"/>
    </symbol>
  </defs>

  <rect x="70" y="40" width="140" height="195" rx="5" fill="url(#cardGrad)" stroke="#7a1119" stroke-width="0.8"/>
  <rect x="74" y="44" width="132" height="187" rx="3" fill="none" stroke="#fff" stroke-width="0.4" opacity="0.15"/>

  <use href="#cornerOrn" x="80" y="50" width="22" height="22"/>
  <use href="#cornerOrn" x="178" y="50" width="22" height="22" transform="scale(-1,1) translate(-378,0)"/>
  <use href="#cornerOrn" x="80" y="203" width="22" height="22" transform="scale(1,-1) translate(0,-428)"/>
  <use href="#cornerOrn" x="178" y="203" width="22" height="22" transform="scale(-1,-1) translate(-378,-428)"/>

  <circle cx="140" cy="138" r="26" fill="url(#centerGrad)" stroke="#8a1118" stroke-width="1"/>
  <circle cx="140" cy="138" r="24" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.45"/>
  <text x="140" y="150" text-anchor="middle" fill="#a01620" font-size="30" font-family="'Noto Serif CJK SC','Microsoft YaHei','PingFang SC',serif" font-weight="900">囍</text>

  <use href="#coin" x="40" y="65" width="24" height="24"/>
  <use href="#coin" x="218" y="55" width="20" height="20"/>
  <use href="#coin" x="225" y="120" width="26" height="26"/>
  <use href="#coin" x="42" y="135" width="18" height="18"/>
  <use href="#coin" x="48" y="208" width="22" height="22"/>
  <use href="#coin" x="216" y="208" width="20" height="20"/>
  <use href="#coin" x="143" y="240" width="22" height="22"/>

  <text x="140" y="298" text-anchor="middle" fill="#7a6e60" font-size="13" font-family="-apple-system,'Segoe UI',sans-serif">Nhấn để mở</text>
